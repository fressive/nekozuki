[project]
name = "nekozuki"
version = "0.1.0"
description = "CTF Writeup Summarization & RAG System"
requires-python = ">=3.12"
authors = [{ name = "nekozuki" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.55.0",
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "tantivy>=0.26.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "tiktoken>=0.7.0",
    "rapidfuzz>=3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
nekozuki = "src.main:main"

[dependency-groups]
dev = ["nekozuki[dev]"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
